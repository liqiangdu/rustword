[package]
name = "rustword"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "A minimal Word (DOCX/DOC) editor written in Rust"
license = "MIT"

[dependencies]
anyhow = "1.0"
cfb = "0.16"
encoding_rs = "0.8"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
roxmltree = "0.20"
similar = "2.7"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
